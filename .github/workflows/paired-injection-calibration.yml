name: SYNTHESIS paired injection calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - rho: '0.0'
            seed: '17601'
          - rho: '0.5'
            seed: '17602'
          - rho: '0.8'
            seed: '17603'
          - rho: '0.95'
            seed: '17604'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install scientific dependencies
        run: python -m pip install numpy==1.26.4 astropy==6.1.7 astroquery==0.4.10
      - name: Run scientific integrity unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install Kotlin compiler
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run paired injection and null campaign
        run: |
          mkdir -p evidence
          printf 'commit=%s\nseed=%s\nrho=%s\n' "$GITHUB_SHA" "${{ matrix.seed }}" "${{ matrix.rho }}" > evidence/config.txt
          bash scripts/run_bls_calibration.sh 300 "${{ matrix.seed }}" all "${{ matrix.rho }}" > evidence/calibration.csv 2> evidence/calibration.log
          python scripts/compare_noise_calibration.py evidence/calibration.csv 300 | tee evidence/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-rho-${{ matrix.rho }}
          path: evidence/
