name: TESS observation validation
on:
  workflow_dispatch:
    inputs:
      tic:
        description: TIC identifier
        required: true
        default: '267306213'
      expected_period:
        description: Independently known period in days, or control for a preselected negative control
        required: true
        default: '1.33823'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install scientific dependencies
        run: python -m pip install numpy==1.26.4 astropy==6.1.7 astroquery==0.4.10
      - name: Install Kotlin compiler
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Download and analyze authentic observations
        env:
          TIC: ${{ inputs.tic }}
          EXPECTED: ${{ inputs.expected_period }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/download_tess.py --tic "$TIC" --output evidence/mast 2>&1 | tee evidence/download.log
          FITS=$(find evidence/mast -name '*_lc.fits' -type f)
          python scripts/prepare_tess.py "$FITS" evidence/observations.csv --tic "$TIC"
          bash scripts/run_tess_validation.sh evidence/observations.csv "$EXPECTED" "$FITS" "$TIC" 2>&1 | tee evidence/result.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tess-validation-evidence
          path: evidence/
          if-no-files-found: warn
