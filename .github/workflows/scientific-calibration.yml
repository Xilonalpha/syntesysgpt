name: SYNTHESIS scientific regression and calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install scientific dependencies
        run: python -m pip install numpy==1.26.4 astropy==6.1.7 astroquery==0.4.10
      - name: Run scientific integrity unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install Kotlin compiler
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run production BLS regression
        run: |
          mkdir -p evidence
          set -o pipefail
          bash scripts/run_bls_check.sh 2>&1 | tee evidence/regression.log
      - name: Run multisignal regression
        if: ${{ !cancelled() }}
        run: bash scripts/run_multisignal_benchmark.sh
      - name: Run seeded calibration
        if: ${{ !cancelled() }}
        run: |
          mkdir -p evidence
          set -o pipefail
          bash scripts/run_bls_calibration.sh 20 11804 2> >(tee evidence/calibration.log >&2) | tee evidence/calibration.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-calibration
          path: evidence/
